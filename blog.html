<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog post — Manas Tiwari">
    <meta name="author" content="Manas Tiwari">
    <title>Blog — Manas Tiwari</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="site-header">
    <nav class="nav">
        <a href="index.html" class="nav-logo">MT</a>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="index.html#projects" class="nav-link">Projects</a></li>
            <li><a href="index.html#blog" class="nav-link active">Blog</a></li>
        </ul>
        <button class="nav-toggle" aria-label="Menu">
            <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
    </nav>
</header>

<div class="post-page">

    <!-- TOOLBAR (hidden until post loads) -->
    <div class="post-toolbar" id="post-toolbar" style="display:none">
        <a href="index.html#blog" class="post-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            All posts
        </a>
        <div class="toolbar-actions">
            <!-- TTS -->
            <button class="tb-btn" id="btn-tts" title="Listen to this post">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                Listen
            </button>

            <span class="tb-sep"></span>

            <!-- PDF -->
            <button class="tb-btn" id="btn-pdf" title="Download as PDF">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                PDF
            </button>

            <span class="tb-sep"></span>

            <!-- Share -->
            <button class="tb-btn" id="btn-twitter" title="Share on Twitter/X">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l11.733 16h4.267l-11.733 -16z"/><path d="M4 20l6.768 -6.768m2.46 -2.46l6.772 -6.772"/></svg>
                Twitter
            </button>

            <button class="tb-btn" id="btn-linkedin" title="Share on LinkedIn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
                LinkedIn
            </button>

            <button class="tb-btn" id="btn-instagram" title="Copy link for Instagram">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
                Instagram
            </button>

            <button class="tb-btn" id="btn-copy" title="Copy link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Copy
            </button>
        </div>
    </div>

    <!-- LOADING STATE -->
    <div class="post-loading" id="post-loading-state">
        <div class="spinner"></div>
        <p>Loading post...</p>
    </div>

    <!-- ERROR STATE -->
    <div class="post-error" id="post-error-state" style="display:none">
        <p class="error-msg">Post not found.</p>
        <a href="index.html#blog" class="btn btn-secondary" style="margin-top:16px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to blog
        </a>
    </div>

    <!-- ARTICLE -->
    <article id="post-article" style="display:none">
        <header class="post-header">
            <h1 class="post-title" id="post-title"></h1>
            <div class="post-meta">
                <time class="post-date" id="post-date"></time>
                <span class="post-rt" id="post-rt"></span>
            </div>
        </header>
        <div class="prose" id="post-content"></div>
    </article>

</div>

<footer class="site-footer">
    <div class="footer-inner">
        <p class="footer-text"><span class="footer-accent">&#10022;</span> Built by <strong>Manas Tiwari</strong></p>
        <p class="footer-sub"><a href="https://github.com/tiwarimanas" target="_blank" rel="noopener noreferrer">github.com/tiwarimanas</a></p>
    </div>
</footer>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script src="js/markdown-parser.js"></script>
<script src="js/post.js"></script>

<!-- Mobile nav toggle for blog page -->
<script>
(function(){
    var t=document.querySelector(".nav-toggle"),l=document.querySelector(".nav-links");
    if(t&&l){t.addEventListener("click",function(){l.classList.toggle("open")});
    document.addEventListener("click",function(e){if(!e.target.closest(".nav"))l.classList.remove("open")});}
})();
</script>
</body>
</html>
